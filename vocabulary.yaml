Inherited Dark Souls 1 boilerplate (ダイアログ.fmg.xml/SP_ダイアログ.fmg.xml/メニュー共通テキスト.fmg.xml):
  Dexterity / Intelligence / Faith / Luck:
    en: Dexterity / Intelligence / Faith / Luck
    uk: Спритність / Інтелект / Віра / Удача
    note: "DS-exclusive stats with no Bloodborne equivalent. Vitality/Endurance/Strength reuse the established Bloodborne stat translations (Життєздатність/Стійкість/Сила) since the English words are identical."
  Attunement (DS stat):
    en: Attunement
    uk: Зосередження
    note: "DS1/3 stat name, shares its root with [[Attunement]] (slots) coined for Bloodborne's Caryll Rune system."
  Poise:
    en: Poise
    uk: Витримка
    note: "Deliberately distinct from Endurance (Стійкість) to avoid collision — both are DS stats that needed separate Ukrainian words."
  Strike (DS attack type):
    en: Strike
    uk: Ударний
    note: "DS3's third physical damage type alongside Slash/Thrust (рублячий/колючий); Bloodborne uses Blunt (тупий) instead of Strike for the equivalent slot, so this is a distinct coinage for DS-boilerplate contexts only."
  sorcery / pyromancy / miracle:
    en: sorcery / pyromancy / miracle
    uk: чари / піромантія / чудо
  Way of White / Princess's Guard / Warrior of Sunlight / Darkwraith / Path of the Dragon / Gravelord Servant / Forest Hunter / Darkmoon Blade / Chaos Servant:
    en: The nine Dark Souls 1 covenants
    uk: Шлях Білого / Варта Принцеси / Воїн Сонячного Світла / Темний Привид / Шлях Дракона / Слуга Володаря Могил / Лісовий Мисливець / Клинок Темного Місяця / Слуга Хаосу
