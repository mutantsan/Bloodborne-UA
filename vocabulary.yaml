Face editor (SP_メニューテキスト.fmg.xml id 425xxx-433xxx):
  face-slider grammatical convention:
    en: (meta entry, not a translatable term)
    uk: (meta entry, not a translatable term)
    note: "~270 short adjective-pair slider labels (Wide/Narrow, Convex/Concave, High/Low, etc.), one pair per face-editing parameter. Convention used: each pair's Ukrainian adjective gender agrees with the Ukrainian noun for that specific header (e.g. Ширина/Висота/Глибина/Товщина/Довжина are feminine -> Широка/Вузька, Низька/Висока, etc.; Розмір/Виступ/Нахил/Інтервал/Контур/Тон are masculine -> Малий/Великий, Опуклий/Увігнутий, etc.; Розташування is neuter -> adverbial Вгору/Вниз; the four plural body-part sections Очі/Ніздрі/Щоки/Губи take plural forms e.g. Носогубні складки: Світлі/Темні). No prior in-game precedent existed for this entire block; established fresh for internal consistency across all ~135 sliders."

